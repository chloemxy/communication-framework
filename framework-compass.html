<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Framework Compass — Patient Education Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
<style>
  /* Page layout only — colours, type and components come from design-system.css */
  .compass { max-width: 960px; margin: 0 auto; padding: var(--sp-8) var(--sp-5) var(--sp-12); }
  .compass-head { margin-bottom: var(--sp-6); }
  .compass-head p { color: var(--n600); margin-top: var(--sp-1); }

  .compass-tools { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-bottom: var(--sp-6); }
  .compass-tools input, .compass-tools select {
    min-height: 36px; padding: 0 var(--sp-3); border: 1px solid var(--n300); border-radius: var(--radius-sm);
    background: var(--white); font-size: var(--fs-sm); color: var(--n900);
  }
  .compass-tools input { flex: 1 1 240px; }
  .compass-count { font-size: var(--fs-xs); color: var(--n600); margin-left: auto; }

  .zone { margin-bottom: var(--sp-8); }
  .zone[hidden] { display: none; }
  .zone-title { font-size: var(--fs-lg); font-weight: 600; margin-bottom: var(--sp-3); display: flex; align-items: center; gap: var(--sp-2); }
  .zone-title::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--zc); }
  .zone-list { list-style: none; }

  .fw { padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--n100); scroll-margin-top: var(--sp-6); }
  .fw:last-child { border-bottom: none; }
  .fw[hidden] { display: none; }
  .fw:target { background: var(--blue-lt); }
  .fw-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-1) var(--sp-3); }
  .fw-label { font-size: var(--fs-sm); font-weight: 600; color: var(--n900); }
  .fw-name { font-size: var(--fs-xs); color: var(--n600); }
  .fw-top .tag { margin-left: auto; }
  .fw-desc { margin-top: var(--sp-1); color: var(--n700); }
  .fw-foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-2); }
  .fw-source { font-size: var(--fs-xs); font-weight: 600; }
  /* Collapsed sections open full width under the row */
  .fw-foot details[open] { flex-basis: 100%; }
  .fw-scoring { padding-top: 0; }
  .sc-facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--sp-1) var(--sp-4); margin-top: var(--sp-3); }
  .sc-facts dt { font-size: var(--fs-xs); font-weight: 600; color: var(--n700); }
  .sc-facts dd { font-size: var(--fs-xs); color: var(--n700); overflow-wrap: anywhere; }
  .sc-note { font-size: var(--fs-xs); color: var(--n600); margin-top: var(--sp-3); }
  .sc-list { margin-top: var(--sp-2); }
  .sc-dom { font-size: var(--fs-xs); font-weight: 600; color: var(--n900); margin-top: var(--sp-3); }
  .sc-items { margin: var(--sp-1) 0 0 var(--sp-5); font-size: var(--fs-sm); color: var(--n800); }
  .sc-items li { margin-bottom: var(--sp-2); }
  .sc-items .tag { margin-left: var(--sp-1); vertical-align: 1px; }
  .sc-rule { font-size: var(--fs-xs); color: var(--n600); margin-top: 2px; }
  @media (max-width: 600px) { .sc-facts { grid-template-columns: minmax(0, 1fr); } }
  .fw-refs ol { margin: var(--sp-2) 0 0 var(--sp-5); font-size: var(--fs-xs); color: var(--n700); }
  .fw-refs li { margin-bottom: var(--sp-1); overflow-wrap: anywhere; }
  .empty { color: var(--n600); padding: var(--sp-6) 0; }

  @media (max-width: 600px) {
    .compass { padding: var(--sp-5) var(--sp-4) var(--sp-8); }
    .fw { padding: var(--sp-3) var(--sp-4); }
    .site-bar { flex-wrap: wrap; padding: var(--sp-2) var(--sp-4); }
  }
</style>
</head>
<body>

<header class="site-bar">
  <a class="site-name" href="index.html">Patient Education Analyzer</a>
  <nav class="site-nav" aria-label="Site">
    <a href="index.html">Studio</a>
    <a href="framework-compass.html" aria-current="page">Framework Compass</a>
  </nav>
</header>

<main class="compass">
  <div class="compass-head">
    <h1>Framework Compass</h1>
    <p id="compass-intro">The frameworks the studio checks against, each linked to its original source.</p>
  </div>

  <div class="compass-tools" role="search">
    <label class="sr-only" for="q">Search frameworks</label>
    <input id="q" type="search" placeholder="Search frameworks" autocomplete="off">
    <label class="sr-only" for="zone-filter">Area</label>
    <select id="zone-filter"></select>
    <span class="compass-count" id="count" aria-live="polite"></span>
  </div>

  <div id="zones"></div>
  <p class="empty" id="empty" hidden>No frameworks match.</p>
</main>

<script src="analysis-engine.js"></script>
<script src="frameworks.js"></script>
<script>
'use strict';
// Built from frameworks.js (what the studio uses) and the engine registry (full references),
// so the Compass shows exactly the frameworks the studio does.
(function(){
  const { FRAMEWORKS, ZONES, OUTPUT_LABEL } = window.PEA_FRAMEWORKS;
  const REG = window.AnalysisEngine.FRAMEWORK_REGISTRY;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+[^\s<.,;)]/g, u => '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>');
  const TAG = { score: 'tag-pass', partial: 'tag-warn', checklist: '' };

  // Pass mark, whatever shape the registry uses: a label, scoring bands, or per-formula targets
  function passMark(p){
    if(!p) return 'No pass mark';
    if(p.uiLabel || p.label) return p.uiLabel || p.label;
    const parts = Object.entries(p).map(([k, v]) =>
      v && typeof v === 'object' ? (v.label || (k.toUpperCase() + (v.target ? ' target ' + v.target : ''))) : null).filter(Boolean);
    return parts.length ? parts.join(' · ') : 'None';
  }
  // "How it's scored": formula, pass mark, rating scale, a short note, then every item by part
  function scoring(reg){
    const rows = [];
    if(reg.formula) rows.push(['Formula', reg.formula]);
    rows.push(['Pass mark', passMark(reg.passThreshold)]);
    if(reg.itemScale) rows.push(['Rating', reg.itemScale]);
    let items = '', dom = null, n = 0;
    (reg.criteria || []).forEach(c => {
      n++;   // items keep their instrument numbers across parts (official number when the engine has one)
      if(c.domain !== dom){ items += (dom === null ? '' : '</ol>') + '<h4 class="sc-dom">' + esc(c.domain) + '</h4><ol class="sc-items">'; dom = c.domain; }
      const tags = [c.requiresVisual ? 'needs the design' : '', c.notAssessableFromDoc ? 'needs records beyond the material' : ''].filter(Boolean);
      const idNo = /^[A-Z][A-Z_-]*?-(\d+)$/.exec(c.id || '');   // e.g. PEMAT-26 → 26; SHARE-S, UPL-1.2 → in order
      items += '<li value="' + (c.itemNo || (idNo ? +idNo[1] : n)) + '">' + esc(c.text) + (tags.length ? ' <span class="tag">' + tags.join(' · ') + '</span>' : '') +
        (c.rule ? '<div class="sc-rule">' + esc(c.rule) + '</div>' : '') + '</li>';
    });
    if(dom !== null) items += '</ol>';
    return '<details class="disclose fw-scoring"><summary>How it’s scored</summary>' +
      '<dl class="sc-facts">' + rows.map(([k, v]) => '<dt>' + k + '</dt><dd>' + esc(v) + '</dd>').join('') + '</dl>' +
      (reg.uiNote || reg.notes ? '<p class="sc-note">' + esc(reg.uiNote || reg.notes) + '</p>' : '') +
      (items ? '<div class="sc-list">' + items + '</div>' : '') + '</details>';
  }

  $('compass-intro').textContent = 'The ' + FRAMEWORKS.length + ' frameworks the studio checks against, each linked to its original source.';
  $('zone-filter').innerHTML = '<option value="">All areas</option>' + ZONES.map(z => '<option value="' + z.key + '">' + esc(z.name) + '</option>').join('');

  $('zones').innerHTML = ZONES.map(z => {
    const items = FRAMEWORKS.filter(f => f.zone === z.key);
    return '<section class="zone" data-zone="' + z.key + '" aria-labelledby="z-' + z.key + '" style="--zc:var(--zone-' + z.key + ')">' +
      '<h2 class="zone-title" id="z-' + z.key + '">' + esc(z.name) + '</h2>' +
      '<ul class="zone-list surface">' + items.map(f => {
        const reg = REG[f.id] || {};
        const refs = (reg.sources || []).map(s => '<li>' + linkify(s) + '</li>').join('');
        return '<li class="fw" id="' + f.key + '" data-text="' + esc((f.label + ' ' + f.name + ' ' + f.desc).toLowerCase()) + '">' +
          '<div class="fw-top"><span class="fw-label">' + esc(f.label) + '</span><span class="fw-name">' + esc(f.name) + '</span>' +
            '<span class="tag ' + TAG[f.output] + '">' + OUTPUT_LABEL[f.output] + '</span></div>' +
          '<p class="fw-desc">' + esc(f.desc) + '</p>' +
          '<div class="fw-foot">' +
            '<a class="fw-source" href="' + esc(f.source.url) + '" target="_blank" rel="noopener">' + esc(f.source.label) + ' ↗</a>' +
            (reg.criteria ? scoring(reg) : '') +
            (refs ? '<details class="disclose fw-refs"><summary>All references</summary><ol>' + refs + '</ol></details>' : '') +
          '</div></li>';
      }).join('') + '</ul></section>';
  }).join('');

  function apply(){
    const q = $('q').value.trim().toLowerCase(), zf = $('zone-filter').value;
    let shown = 0;
    document.querySelectorAll('.zone').forEach(sec => {
      let any = 0;
      sec.querySelectorAll('.fw').forEach(li => {
        const ok = (!zf || sec.dataset.zone === zf) && (!q || li.dataset.text.includes(q));
        li.hidden = !ok; if(ok){ any++; shown++; }
      });
      sec.hidden = !any;
    });
    $('count').textContent = shown + ' of ' + FRAMEWORKS.length;
    $('empty').hidden = shown > 0;
  }
  $('q').addEventListener('input', apply);
  $('zone-filter').addEventListener('change', apply);
  apply();
})();
</script>
</body>
</html>
