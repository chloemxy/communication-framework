<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{var t=localStorage.getItem('pea.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<title>Framework Compass — Patient Education Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
<script src="theme-switch.js" defer></script>
<style>
  /* Page layout only: colours, type, controls and the theme switch come from design-system.css */
  .compass:focus { outline: none; }
  .compass { max-width: 960px; margin: 0 auto; padding: var(--sp-8) var(--sp-5) var(--sp-12); }
  .compass-head { margin-bottom: var(--sp-6); }
  .compass-head p { color: var(--ink-2); margin-top: var(--sp-1); max-width: 70ch; }

  .compass-tools { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-bottom: var(--sp-6); }
  /* search and area filter stay pinned at the top while the list scrolls */
  .compass-tools { position: sticky; top: 0; z-index: 5; background: var(--desk); padding: var(--sp-3) 0; border-bottom: 1px solid var(--rule); margin-bottom: var(--sp-5); }
  .compass-tools input, .compass-tools select { min-height: 36px; padding: 0 var(--sp-3); }
  .compass-tools input { flex: 1 1 240px; min-width: 0; }
  .compass-tools select { max-width: 100%; }
  .compass-count { font-size: var(--fs-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; margin-left: auto; }

  /* Zones: a heading on the desk, then one sheet of rows separated by hairlines */
  .zone { margin-bottom: var(--sp-8); }
  .zone[hidden] { display: none; }
  .zone-title { margin-bottom: var(--sp-3); color: var(--ink); }
  .zone-list { list-style: none; overflow: hidden; }

  .fw { padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--rule); scroll-margin-top: 88px; }
  .fw:last-child { border-bottom: none; }
  .fw[hidden] { display: none; }
  .fw:target { background: var(--sheet-2); box-shadow: inset 2px 0 0 var(--form-blue); }
  .fw-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-1) var(--sp-3); }
  .fw-label { font-size: var(--fs-sm); font-weight: 600; color: var(--ink); }
  .fw-name { font-size: var(--fs-xs); color: var(--ink-2); }
  /* output type: plain caption text, the same as the studio's Frameworks list (no status colour) */
  .fw-out { margin-left: auto; font-size: var(--fs-xs); color: var(--ink-2); white-space: nowrap; }
  .fw-desc { margin-top: var(--sp-1); color: var(--ink); max-width: 70ch; }
  .fw-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--sp-5); margin-top: var(--sp-1); }
  .fw-source { display: inline-flex; align-items: center; gap: var(--sp-1); min-height: 32px; font-size: var(--fs-xs); font-weight: 600; }
  .fw-source:focus-visible, details.disclose > summary:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  /* Collapsed sections open full width under the row */
  .fw-foot details[open] { flex-basis: 100%; }

  /* "How it's scored": facts, then the score sheet */
  .sc-facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--sp-1) var(--sp-4); margin-top: var(--sp-2); }
  .sc-facts dt { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); }
  .sc-facts dd { font-size: var(--fs-xs); color: var(--ink); overflow-wrap: anywhere; }
  .sc-note { font-size: var(--fs-xs); color: var(--ink-2); margin-top: var(--sp-3); max-width: 70ch; }
  .sc-list { margin-top: var(--sp-2); padding-bottom: var(--sp-2); }
  /* Section label: one step heavier rule than the row hairlines, like a printed score sheet */
  .sc-dom { font-size: var(--fs-xs); font-weight: 600; line-height: 1.5; color: var(--ink); margin-top: var(--sp-5); padding-bottom: var(--sp-1); border-bottom: 1px solid var(--ink-2); }
  .sc-list > .sc-dom:first-child { margin-top: var(--sp-3); }
  /* Score-sheet rows: item number in a fixed margin column, then the text */
  .sc-items { list-style: none; }
  .sc-items li { display: grid; grid-template-columns: 4ch minmax(0, 1fr); column-gap: var(--sp-3); padding: var(--sp-2) 0; border-bottom: 1px solid var(--rule); }
  .sc-items li:last-child { border-bottom: none; }
  .sc-n { text-align: right; font-size: var(--fs-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .sc-t { font-size: var(--fs-sm); color: var(--ink); overflow-wrap: anywhere; }
  .sc-tags { display: inline-flex; flex-wrap: wrap; gap: var(--sp-1); margin-left: var(--sp-2); vertical-align: 1px; }
  .sc-rule { font-size: var(--fs-xs); color: var(--ink-2); margin-top: 2px; }

  .fw-refs ol { margin: var(--sp-2) 0 var(--sp-2) var(--sp-5); font-size: var(--fs-xs); color: var(--ink); }
  .fw-refs li { margin-bottom: var(--sp-1); overflow-wrap: anywhere; }
  .empty { color: var(--ink-2); padding: var(--sp-6) 0; }

  @media (max-width: 600px) {
    .compass { padding: var(--sp-5) var(--sp-4) var(--sp-8); }
    .fw { padding: var(--sp-3) var(--sp-4); }
    .sc-facts { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .sc-facts dd { margin-bottom: var(--sp-1); }
    .compass-count { margin-left: 0; flex-basis: 100%; }
  }
  @media (max-width: 600px), (pointer: coarse) {
    .compass-tools input, .compass-tools select { min-height: 40px; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to main content</a>
<header class="site-bar">
  <a class="site-name" href="index.html">Patient Education Analyzer</a>
  <nav class="site-nav" aria-label="Site">
    <a href="index.html">Studio</a>
    <a href="framework-compass.html" aria-current="page">Framework Compass</a>
    <a href="index.html#about">About</a>
  </nav>
  <span class="bar-divider" aria-hidden="true"></span>
  <div class="seg theme-switch" role="group" aria-label="Colour theme" data-theme-switch hidden>
    <button type="button" data-theme-set="system" aria-pressed="true" title="Follow the system setting"><svg class="ts-ico" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="5.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2.25a5.75 5.75 0 0 1 0 11.5z" fill="currentColor"/></svg><span class="ts-lbl">System</span></button>
    <button type="button" data-theme-set="light" aria-pressed="false" title="Light"><svg class="ts-ico" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="2.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="ts-lbl">Light</span></button>
    <button type="button" data-theme-set="dark" aria-pressed="false" title="Dark"><svg class="ts-ico" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M13.25 9.6A5.5 5.5 0 0 1 6.4 2.75a5.5 5.5 0 1 0 6.85 6.85z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="ts-lbl">Dark</span></button>
  </div>
</header>

<main class="compass" id="main" tabindex="-1">
  <div class="compass-head">
    <h1>Framework Compass</h1>
    <p id="compass-intro">The frameworks the studio checks against, each linked to its original source.</p>
  </div>

  <div class="compass-tools" role="search">
    <label class="sr-only" for="q">Search frameworks</label>
    <input id="q" type="search" placeholder="Search frameworks" autocomplete="off">
    <label class="sr-only" for="zone-filter">Area</label>
    <select id="zone-filter"></select>
    <span class="compass-count" id="count" aria-live="polite"></span>
  </div>

  <div id="zones"></div>
  <p class="empty" id="empty" hidden>No frameworks match.</p>
</main>

<script src="analysis-engine.js"></script>
<script src="frameworks.js"></script>
<script>
'use strict';
// Built from frameworks.js (what the studio uses) and the engine registry (full references),
// so the Compass shows exactly the frameworks the studio does.
(function(){
  const { FRAMEWORKS, ZONES, OUTPUT_LABEL } = window.PEA_FRAMEWORKS;
  const REG = window.AnalysisEngine.FRAMEWORK_REGISTRY;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+[^\s<.,;)]/g, u => '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>');

  // Pass mark, whatever shape the registry uses: a label, scoring bands, or per-formula targets
  function passMark(p){
    if(!p) return 'No pass mark';
    if(p.uiLabel || p.label) return p.uiLabel || p.label;
    const parts = Object.entries(p).map(([k, v]) =>
      v && typeof v === 'object' ? (v.label || (k.toUpperCase() + (v.target ? ' target ' + v.target : ''))) : null).filter(Boolean);
    return parts.length ? parts.join('; ') : 'None';
  }
  // "How it's scored": formula, pass mark, rating scale, a short note, then every item by part
  function scoring(reg){
    const rows = [];
    if(reg.formula) rows.push(['Formula', reg.formula]);
    rows.push(['Pass mark', passMark(reg.passThreshold)]);
    if(reg.itemScale) rows.push(['Rating', reg.itemScale]);
    let items = '', dom = null, n = 0;
    (reg.criteria || []).forEach(c => {
      n++;   // items keep their instrument numbers across parts (official number when the engine has one)
      if(c.domain !== dom){ items += (dom === null ? '' : '</ol>') + '<h4 class="sc-dom">' + esc(c.domain) + '</h4><ol class="sc-items">'; dom = c.domain; }
      const tags = [c.requiresVisual ? 'needs the design' : '', c.notAssessableFromDoc ? 'needs records beyond the material' : ''].filter(Boolean);
      const idNo = /^[A-Z][A-Z_-]*?-(\d+)$/.exec(c.id || '');   // e.g. PEMAT-26 → 26; SHARE-S, UPL-1.2 → in order
      const no = c.itemNo || (idNo ? +idNo[1] : n);
      // Score-sheet row: the number sits in the margin column (list marker hidden; value keeps the semantics)
      items += '<li value="' + esc(no) + '"><span class="sc-n">' + esc(no) + '</span><div class="sc-t">' + esc(c.text) +
        (tags.length ? '<span class="sc-tags">' + tags.map(t => '<span class="tag">' + t + '</span>').join('') + '</span>' : '') +
        (c.rule ? '<div class="sc-rule">' + esc(c.rule) + '</div>' : '') + '</div></li>';
    });
    if(dom !== null) items += '</ol>';
    return '<details class="disclose fw-scoring"><summary>How it’s scored</summary>' +
      '<dl class="sc-facts">' + rows.map(([k, v]) => '<dt>' + k + '</dt><dd>' + esc(v) + '</dd>').join('') + '</dl>' +
      (reg.uiNote || reg.notes ? '<p class="sc-note">' + esc(reg.uiNote || reg.notes) + '</p>' : '') +
      (items ? '<div class="sc-list">' + items + '</div>' : '') + '</details>';
  }

  $('compass-intro').textContent = 'The ' + FRAMEWORKS.length + ' frameworks the studio checks against, each linked to its original source.';
  $('zone-filter').innerHTML = '<option value="">All areas</option>' + ZONES.map(z => '<option value="' + z.key + '">' + esc(z.name) + '</option>').join('');

  $('zones').innerHTML = ZONES.map(z => {
    const items = FRAMEWORKS.filter(f => f.zone === z.key);
    return '<section class="zone" data-zone="' + z.key + '" aria-labelledby="z-' + z.key + '">' +
      '<h2 class="zone-title" id="z-' + z.key + '">' + esc(z.name) + '</h2>' +
      '<ul class="zone-list surface">' + items.map(f => {
        const reg = REG[f.id] || {};
        const refs = (reg.sources || []).map(s => '<li>' + linkify(s) + '</li>').join('');
        return '<li class="fw" id="' + f.key + '" data-text="' + esc((f.label + ' ' + f.name + ' ' + f.desc).toLowerCase()) + '">' +
          '<div class="fw-top"><span class="fw-label">' + esc(f.label) + '</span><span class="fw-name">' + esc(f.name) + '</span>' +
            '<span class="fw-out">' + OUTPUT_LABEL[f.output] + '</span></div>' +
          '<p class="fw-desc">' + esc(f.desc) + '</p>' +
          '<div class="fw-foot">' +
            '<a class="fw-source" href="' + esc(f.source.url) + '" target="_blank" rel="noopener">' + esc(f.source.label) + ' <span aria-hidden="true">↗</span><span class="sr-only"> (opens in a new tab)</span></a>' +
            (reg.criteria ? scoring(reg) : '') +
            (refs ? '<details class="disclose fw-refs"><summary>All references</summary><ol>' + refs + '</ol></details>' : '') +
          '</div></li>';
      }).join('') + '</ul></section>';
  }).join('');

  function apply(){
    const q = $('q').value.trim().toLowerCase(), zf = $('zone-filter').value;
    let shown = 0;
    document.querySelectorAll('.zone').forEach(sec => {
      let any = 0;
      sec.querySelectorAll('.fw').forEach(li => {
        const ok = (!zf || sec.dataset.zone === zf) && (!q || li.dataset.text.includes(q));
        li.hidden = !ok; if(ok){ any++; shown++; }
      });
      sec.hidden = !any;
    });
    $('count').textContent = shown + ' of ' + FRAMEWORKS.length;
    $('empty').hidden = shown > 0;
  }
  $('q').addEventListener('input', apply);
  $('zone-filter').addEventListener('change', apply);
  apply();
})();
</script>
</body>
</html>
